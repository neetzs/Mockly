server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: React Router maneja las rutas en el navegador. Si alguien recarga /dashboard,
    # nginx no tiene ese archivo, así que devolvemos index.html y React resuelve la ruta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear "para siempre".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
